name: Deploy AetherScope WebGL Demo to GitHub Pages

on:
  workflow_dispatch: # Déclenchement manuel uniquement (évite les erreurs de billing sur git push)
  # Pour réactiver le build CI automatique après déblocage de votre facturation GitHub :
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "crates/desktop-shell/ui/**"
  #     - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL Cockpit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: crates/desktop-shell/ui/package-lock.json

      - name: Install dependencies
        working-directory: crates/desktop-shell/ui
        run: npm ci

      - name: Build Standalone WebGL SingleFile App
        working-directory: crates/desktop-shell/ui
        run: npm run build

      - name: Add .nojekyll flag
        run: touch crates/desktop-shell/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/desktop-shell/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
