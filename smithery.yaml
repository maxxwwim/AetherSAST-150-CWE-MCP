# Smithery MCP Server Specification
# https://smithery.ai/docs/config#smitheryyaml
version: "2.2.1"
name: "aetherscope-mcp"
description: "Moteur MCP d'intelligence architecturale & Pare-Feu IA temps réel (< 50ms, 150+ CWEs, Visualiseur 3D WebGL2 & Obsidian Vault)."

startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties:
      port:
        type: "number"
        default: 3030
        description: "Port HTTP du serveur AetherScope (défaut: 3030)"
      path:
        type: "string"
        default: "."
        description: "Chemin racine du projet ou coffre Obsidian à surveiller"
  commandFunction: |-
    config => ({
      command: 'aetherscope-mcp',
      args: ['--port', String(config.port || 3030), '--path', config.path || '.'],
      env: {}
    })
